[project]
name = "saleor-synth-probe"
version = "0.1.0"
description = "Synthetic latency probe emitting OTLP metrics"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[project.scripts]
saleor-synth-probe = "probe.main:main"